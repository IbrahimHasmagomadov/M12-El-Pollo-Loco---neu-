<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="icon" href="img/favicon.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />

    <script src="models/drawable-object.class.js"></script>
    <script src="models/warning-sign.class.js"></script>
    <script src="models/obstacle.class.js"></script>
    <script src="models/stone.class.js"></script>
    <script src="models/cactus.class.js"></script>
    <script src="models/collectable-object.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/bottle-status-bar.class.js"></script>
    <script src="models/coin-status-bar.class.js"></script>
    <script src="models/endboss-status-bar.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="Levels/level1.js"></script>
    <script src="js/game.js"></script>
  </head>

  <body>
    <h1>El Pollo Loco</h1>
    <div id="startScreen" class="start-screen">
      <img
        class="start-screen-img"
        src="img/9_intro_outro_screens/start/startscreen_1.png"
        alt="El Pollo Loco Startscreen"
      />

      <div id="highscoreDisplay" class="highscore-display">Highscore: 0</div>

      <div class="start-screen-buttons">
        <button onclick="startGame()">Start</button>

        <button onclick="showGameInfo()">Info</button>
      </div>
      

      <div id="gameInfo" class="game-info d-none">
        <h2>HOW TO PLAY</h2>

        <div class="game-info-box">
          <div class="control-row">
            <span>LEFT</span>
            <img
              src="img/icons/keys/left-key.png"
              class="key-icon"
              alt="left key"
            />
          </div>

          <div class="control-row">
            <span>RIGHT</span>
            <img
              src="img/icons/keys/right-key.png"
              class="key-icon"
              alt="right key"
            />
          </div>

          <div class="control-row">
            <span>JUMP</span>
            <div class="key-group">
              <img
                src="img/icons/keys/space-key.png"
                class="space-key-icon"
                alt="space key"
              />
              <span class="or-text">or</span>

              <img
                src="img/icons/keys/up-key.png"
                class="key-icon"
                alt="up key"
              />
            </div>
          </div>

          <div class="control-row">
            <span>THROW BOTTLE</span>
            <img src="img/icons/keys/d-key.png" class="key-icon" alt="d key" />
          </div>
        </div>

        <button class="info-close-btn" onclick="hideGameInfo()">BACK</button>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas" class="d-none" width="720" height="480"></canvas>

      <div id="gameControls" class="game-controls d-none">
        <button
          id="backToMenuBtn"
          class="back-to-menu-btn"
          onclick="backToMenu()"
        >
         Menu
        </button>

        <button
          id="soundToggleBtn"
          class="icon-btn"
          onclick="toggleSound()"
          title="Sound ein-/ausschalten"
        >
          <img
            id="soundIcon"
            src="img/icons/sound/sound-on.png"
            alt="Sound an"
          />
        </button>
      </div>

      <div id="winScreenActions" class="win-screen-actions d-none">
        <button class="play-again-btn" onclick="playAgain()">
          Nochmal spielen
        </button>
      </div>
    </div>
    

    <script>
      init();
    </script>
  </body>
</html>
